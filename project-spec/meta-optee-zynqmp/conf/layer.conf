# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
	${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-optee-zynqmp"
BBFILE_PATTERN_meta-optee-zynqmp = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-optee-zynqmp = "7"
LAYERSERIES_COMPAT_meta-optee-zynqmp = "zeus"
